<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>Tu c&#243;digo para recuperar HEDA</title>
<style>
:root { color-scheme: light dark; supported-color-schemes: light dark; }
body, table, td, p, h1 { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
table { border-spacing: 0; }
a[x-apple-data-detectors], .otp a, #body .otp a, u + #body .otp a {
 color: inherit !important; text-decoration: none !important; font-size: inherit !important;
 font-family: inherit !important; font-weight: inherit !important; line-height: inherit !important;
 pointer-events: none !important; cursor: text !important;
}
.otp { -webkit-user-select: text; user-select: text; white-space: nowrap; }
@media screen and (max-width: 480px) {
 .outer { padding: 16px 10px !important; }
 .content { padding: 26px 20px !important; }
 .heading { font-size: 25px !important; line-height: 32px !important; }
 .otp { font-size: 30px !important; letter-spacing: 3px !important; }
}
@media (prefers-color-scheme: dark) {
 body, .page { background-color: #0B1220 !important; }
 .card { background-color: #151F30 !important; border-color: #33445E !important; }
 .heading, .brand, .otp { color: #E5ECF8 !important; }
 .copy { color: #D2DCEB !important; }
 .muted { color: #A8B7CC !important; }
 .codebox { background-color: #182D49 !important; border-color: #334C6C !important; }
}
</style>
</head>
<body id="body" class="page" style="margin:0;padding:0;width:100%;background-color:#F5F7FB;font-family:Arial,Helvetica,sans-serif;color:#183153;">
<div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">Tu c&#243;digo para elegir una nueva contrase&#241;a en HEDA.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="page" style="width:100%;background-color:#F5F7FB;">
<tr><td align="center" class="outer" style="padding:28px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="card" style="width:100%;max-width:480px;background-color:#FFFFFF;border:1px solid #E2E8F0;border-radius:20px;">
<tr><td class="content" style="padding:32px 28px;">
<p class="brand" style="margin:0 0 24px;color:#092C56;font-size:22px;line-height:28px;font-weight:800;letter-spacing:2px;">HEDA</p>
<h1 class="heading" style="margin:0 0 14px;color:#183153;font-size:28px;line-height:35px;">Tu c&oacute;digo de acceso</h1>
<p class="copy" style="margin:0 0 22px;color:#334155;font-size:16px;line-height:25px;">Vuelve a HEDA e introduce este c&oacute;digo para cambiar tu contrase&ntilde;a.</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;">
<tr><td align="center" class="codebox" style="padding:22px 8px;background-color:#EDF4FF;border:1px solid #D8E5FA;border-radius:14px;">
<span class="otp" dir="ltr" style="display:inline-block;color:#092C56;font-family:'Courier New',monospace;font-size:32px;line-height:42px;font-weight:700;letter-spacing:4px;text-decoration:none;white-space:nowrap;">{{ .Token }}</span>
</td></tr></table>
<p class="muted" style="margin:12px 0 24px;color:#64748B;font-size:14px;line-height:22px;text-align:center;">Copia el c&#243;digo y vuelve a la app.</p>
<p class="copy" style="margin:0 0 12px;color:#334155;font-size:15px;line-height:24px;">Este c&oacute;digo es de un solo uso.</p>
<p class="muted" style="margin:0;color:#64748B;font-size:14px;line-height:22px;">Si no pediste este cambio, ignora este correo. No compartas el c&oacute;digo.</p>
</td></tr></table>
</td></tr></table>
</body></html>
