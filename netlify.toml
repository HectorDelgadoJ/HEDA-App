[build]
  command = "npm run build:web"
  publish = "dist"
[build.environment]
  NODE_VERSION = "22.13.0"
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
